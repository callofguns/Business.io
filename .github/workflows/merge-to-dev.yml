name: Merge feature branch into dev

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: write

concurrency:
  group: merge-to-dev
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge ${{ github.ref_name }} into dev
        # No "[skip ci]" here: GitHub Actions treats that as a push-level flag
        # that suppresses *every* push-triggered workflow on this commit, not
        # just this one. Since dev is later fast-forwarded into main, that tag
        # was silently killing the deploy-pages trigger whenever main's tip
        # happened to be one of these merge commits.
        run: |
          git fetch origin "${{ github.ref_name }}"
          git merge --no-ff "origin/${{ github.ref_name }}" \
            -m "Auto-merge ${{ github.ref_name }} into dev"

      - name: Push dev
        run: git push origin dev
